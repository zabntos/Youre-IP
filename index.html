
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>youre IP</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;
  padding:20px;background:#080711;color:#f7f3ff;
  font-family:Arial,sans-serif
}
.card{
  width:100%;max-width:460px;text-align:center;padding:32px 24px;
  background:linear-gradient(145deg,#1b1230,#100e1b);
  border:1px solid #7542ae;border-radius:24px;
  box-shadow:0 0 55px #7728bd25
}
.logo{font-size:13px;letter-spacing:5px;color:#bd8aff}
h1{font-size:42px;margin:18px 0 10px}
p{color:#bcb4ce;line-height:1.6}
.ip{
  margin:28px 0;padding:23px 12px;min-height:82px;
  display:grid;place-items:center;overflow-wrap:anywhere;
  background:#090711;border:1px solid #38254d;border-radius:14px;
  font-size:clamp(20px,6vw,30px);font-weight:bold;color:#d8b5ff
}
button{
  width:100%;padding:15px;border:0;border-radius:12px;
  background:#914bdf;color:white;font-size:16px;
  font-weight:bold;cursor:pointer
}
button:disabled{opacity:.6}
#status{font-size:13px;min-height:20px}
.note{font-size:12px;color:#8f879f;margin-top:22px}
</style>
</head>
<body>
<main class="card">
  <div class="logo">NETWORK TOOL</div>
  <h1>youre IP</h1>
  <p>Discover your public IP address instantly</p>

  <div class="ip" id="ip">Click below to start</div>

  <button id="check">Show my IP</button>
  <p id="status" role="status"></p>

  <p class="note">
    Your IP is requested only when you press the button.
    The lookup service receives your request.
  </p>
</main>

<script>
const ip = document.getElementById("ip");
const status = document.getElementById("status");
const button = document.getElementById("check");

button.addEventListener("click", async () => {
  button.disabled = true;
  ip.textContent = "Loading...";
  status.textContent = "Looking up your public IP";

  try {
    const response = await fetch(
      "https://api.ipify.org?format=json",
      { cache: "no-store" }
    );

    if (!response.ok) throw new Error("Request failed");

    const data = await response.json();
    if (!data.ip) throw new Error("No IP returned");

    ip.textContent = data.ip;
    status.textContent = "Your public IP address";
  } catch {
    ip.textContent = "Could not load IP";
    status.textContent = "Check your internet and try again";
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
